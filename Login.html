<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDSC Login</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        body {
            background-image: url("pics/back.jpg");
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 350px;
            text-align: center;
        }

        .container h2 {
            margin-bottom: 10px;
            color: green;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 70%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: beige;
            color: #000;
            font-weight: bold;
        }

        input::placeholder {
            color: #888;
            font-weight: normal;
        }

        button {
            margin-top: 20px;
            width: 50%;
            padding: 12px;
            background-color: blue;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #FABB04;
        }

        .footer {
            margin-top: 15px;
            font-size: 0.8em;
            color: #000;
        }

        .toggle {
            cursor: pointer;
            color: #00adb5;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .visible {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 id="form-title">Register</h2>
        <div id="register-form" class="visible">
            <input type="text" id="reg-name" placeholder="Enter your name" required>
            <input type="email" id="reg-email" placeholder="Enter your email" required>
            <input type="password" id="reg-password" placeholder="Enter your password" required>
            <input type="password" id="reg-cpassword" placeholder="Confirm your password" required>
            <button id="register-btn">Register</button>
        </div>

        <div id="login-form" class="hidden">
            <input type="email" id="login-email" placeholder="Enter your email" required>
            <input type="password" id="login-password" placeholder="Enter your password" required>
            <button id="login-btn">Login</button>
        </div>

        <div class="footer">
            <span id="toggle-text">Already have an account? <span class="toggle">Login here</span></span>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            // Toggle between Login and Register forms
            $(document).on("click", ".toggle", function () {
                $("#register-form, #login-form").toggleClass("visible hidden");

                if ($("#register-form").hasClass("visible")) {
                    $("#form-title").text("Register");
                    $("#toggle-text").html("Already have an account? <span class='toggle'>Login here</span>");
                } else {
                    $("#form-title").text("Login");
                    $("#toggle-text").html("Don't have an account? <span class='toggle'>Register here</span>");
                }
            });

            // Register user
            $("#register-btn").click(function () {
                const name = $("#reg-name").val();
                const email = $("#reg-email").val();
                const password = $("#reg-password").val();
                const cpassword = $("#reg-cpassword").val();

                if (!name || !email || !password || !cpassword) {
                    alert("Please fill out all fields.");
                    return;
                }

                if (password !== cpassword) {
                    alert("Confirm password does not match password.");
                    return;
                }

                const userData = { name, email, password };
                localStorage.setItem(email, JSON.stringify(userData));

                alert("Registration successful! You can now log in.");
                $(".toggle").click(); // Automatically switch to login form
            });

            // Login user
            $("#login-btn").click(function () {
                const email = $("#login-email").val();
                const password = $("#login-password").val();
                const storedUser = JSON.parse(localStorage.getItem(email));

                if (storedUser && storedUser.password === password) {
                    alert(`Welcome back, ${storedUser.name}! Redirecting to home page.`);
                    window.location.href = "GDSC.html";
                } else {
                    alert("Incorrect email or password.");
                }
            });
        });
    </script>
</body>

</html>
