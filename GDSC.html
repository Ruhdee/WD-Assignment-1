<!DOCTYPE html>
<html id="html1">
<head>
    <title>DSC VIT, Pune</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>
</head>
<body id="body1">
    <div class="video-container">
        <iframe 
            src="https://www.youtube.com/embed/earTjC0iSjg?autoplay=1&mute=1&loop=1&playlist=earTjC0iSjg&controls=0&showinfo=0&modestbranding=1"
            allow="autoplay">
        </iframe>
    </div>
    
    <header>
        <div class="container">
            <div class="divin"><a id="a1" href="Events.html">Events</a></div>
            <div class="divin"><a id="a2" href="Gallery.html">Gallery</a></div>
            <div class="divin"><a id="a3" href="Login.html">Register</a></div>
            <div class="divin"><a id="a4" href="Contact.html">Contact Us</a></div>
        </div>
    </header>
    
    <h1>
        <marquee>Welcome to Developer Student Clubs, Vishwakarma Institute of Technology, Pune</marquee>
    </h1>
    
    <img id="logo" src="pics/DSClogo.png" alt="DSC VIT, Pune"><br>
    
    <div id="textdiv">
        <h2>Share Your Success Story</h2>
        <form id="successForm">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="story">Success Story:</label>
            <textarea id="story" name="story" required></textarea>
            
            <button type="submit">Send Success Story</button>
        </form>
    </div>
    
</body>
</html>
