<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDSC Register</title>
    <style>
        body {
            background-image: url("pics/back.jpg");
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 350px;
            text-align: center;
        }

        .container h2 {
            margin-bottom: 10px;
            color: green;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 70%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: beige;
            color: #000;
            font-weight: bold;
        }

        input::placeholder {
            color: #888;
            font-weight: normal;
        }

        button {
            margin-top: 20px;
            width: 50%;
            padding: 12px;
            background-color: blue;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #FABB04;
        }

        .footer {
            margin-top: 15px;
            font-size: 0.8em;
            color: #000;
        }

        .toggle {
            cursor: pointer;
            color: #00adb5;
            text-decoration: underline;
        }

       
    </style>
</head>

<body>

    <div class="container">
        <h2 id="form-title">Register</h2>
        <div id="register-form" class="visible">
            <input type="text" id="reg-name" placeholder="Enter your name" required>
            <input type="email" id="reg-email" placeholder="Enter your email" required>
            <input type="password" id="reg-password" placeholder="Enter your password" required>
            <input type="password" id="reg-cpassword" placeholder="Confirm your password" required>
            <button onclick="registerUser()" id="register-btn">Register</button>
        </div>

        

        <div class="footer">
            <span id="toggle-text">Already have an account? <span class="toggle" onclick="toggleForm()">Login
                    here</span></span>
        </div>
    </div>

    



</body>

</html>
