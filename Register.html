<html>

<head>
    <title>DSC Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="register" background="pics/back.jpg">
    <div class="center">
        <form>
            <h3>Sign Up</h3>
            <div class="form-group">
                <label for="firstname">First Name</label>
                <input type="text" name="firstname" id="firstname" placeholder="First Name">
            </div>
            
            <div class="form-group">
                <label for="lastname">Last Name</label>
                <input type="text" name="lastname" id="lastname" placeholder="Last Name">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" name="phone" id="phone" placeholder="Phone Number">
            </div>
            
            <div class="form-group">
                <label for="emailid">Email ID</label>
                <input type="email" name="emailid" id="emailid" placeholder="Email ID">
            </div>
    
            <div class="form-group">
                <label for="spass">Set Password</label>
                <input type="password" name="spass" id="spass" placeholder="Set Password">
            </div>
    
            <div class="form-group">
                <label for="cpass">Confirm Password</label>
                <input type="password" name="cpass" id="cpass" placeholder="Confirm Password">
            </div>
    
            <div style="display: flex; justify-content: space-between;">
                <input type="submit" name="submit" id="submit" value="Submit" onclick="alert('Submitted')">
                <input type="reset" name="reset" id="reset" value="Clear">
            </div>
        </form>
    
    </div>
</body>

</html>
