<!DOCTYPE html>
<html>

<head>
    <title>DSC Events</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>

<body background="pics/back.jpg">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="text-center mb-4 text-white">DSC Events</h1>
                <table class="table table-striped table-bordered table-hover bg-white">
                    <thead class="thead-dark">
                        <tr>
                            <th scope="col">Sr. No.</th>
                            <th scope="col">Event Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>1.</td><td>Tensor Fiesta Hackathon</td></tr>
                        <tr><td>2.</td><td>Flutter Forge</td></tr>
                        <tr><td>3.</td><td>Android Accelerated</td></tr>
                        <tr><td>4.</td><td>Google Summer of Code</td></tr>
                        <tr><td>5.</td><td>Web Blitz</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row justify-content-center mt-5">
            <div class="col-md-10">
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <img src="pics/TensorFiestaHackathon.png" class="card-img-top" alt="Tensor Fiesta Hackathon">
                            <div class="card-body">
                                <h5 class="card-title">Tensor Fiesta Hackathon</h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <img src="pics/FlutterForge.png" class="card-img-top" alt="Flutter Forge">
                            <div class="card-body">
                                <h5 class="card-title">Flutter Forge</h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <img src="pics/AndroidAccelerated.png" class="card-img-top" alt="Android Accelerated">
                            <div class="card-body">
                                <h5 class="card-title">Android Accelerated</h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <img src="pics/GSOC.png" class="card-img-top" alt="Google Summer of Code">
                            <div class="card-body">
                                <h5 class="card-title">Google Summer of Code</h5>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <img src="pics/WebBlitz.png" class="card-img-top" alt="Web Blitz">
                            <div class="card-body">
                                <h5 class="card-title">Web Blitz</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

  
</body>

</html>
